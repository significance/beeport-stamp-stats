database:
  path: "postgresql://localhost/beeport4_testing"

rpc:
  endpoints:
    # FairDataSociety endpoint (user provided)
    - url: "https://xdai.fairdatasociety.org"
      rate_limit: adaptive
      priority: 1
      weight: 1

    # Official Gnosis Chain RPC
    - url: "https://rpc.gnosischain.com"
      rate_limit: adaptive
      priority: 1
      weight: 1

    # dRPC - AI-powered load balancer
    - url: "https://gnosis.drpc.org"
      rate_limit: adaptive
      priority: 1
      weight: 1

    # Ankr - Popular provider
    - url: "https://rpc.ankr.com/gnosis"
      rate_limit: adaptive
      priority: 1
      weight: 1

    # 1RPC - Privacy-focused
    - url: "https://1rpc.io/gnosis"
      rate_limit: adaptive
      priority: 1
      weight: 1

    # PublicNode - Community infrastructure
    - url: "https://gnosis-rpc.publicnode.com"
      rate_limit: adaptive
      priority: 1
      weight: 1

    # BlockPi - Public access
    - url: "https://gnosis.blockpi.network/v1/rpc/public"
      rate_limit: adaptive
      priority: 1
      weight: 1

    # BlastAPI - Public tier
    - url: "https://gnosis-mainnet.public.blastapi.io"
      rate_limit: adaptive
      priority: 1
      weight: 1

    # Gateway.fm - Public access
    - url: "https://rpc.gnosis.gateway.fm"
      rate_limit: adaptive
      priority: 1
      weight: 1

    # OnFinality - Public tier
    - url: "https://gnosis.api.onfinality.io/public"
      rate_limit: adaptive
      priority: 1
      weight: 1

    # Nodies - Public access
    - url: "https://gnosis-public.nodies.app"
      rate_limit: adaptive
      priority: 1
      weight: 1

    # Omniatech - Public mainnet
    - url: "https://endpoints.omniatech.io/v1/gnosis/mainnet/public"
      rate_limit: adaptive
      priority: 1
      weight: 1

    # POKT Network
    - url: "https://gnosischain-rpc.gateway.pokt.network"
      rate_limit: adaptive
      priority: 1
      weight: 1

    # Tatum Gateway
    - url: "https://gno-mainnet.gateway.tatum.io"
      rate_limit: adaptive
      priority: 1
      weight: 1

    # Blockscout Archive (archive node for historical data)
    - url: "https://xdai-archive.blockscout.com"
      rate_limit: adaptive
      priority: 2
      weight: 1

rate_limiting:
  max_concurrent_requests: 100
  health_check_interval_seconds: 60
  stats_log_interval_seconds: 30

  adaptive:
    start_rps: 10.0
    max_rps: 1000.0
    ramp_up_factor: 1.2
    back_off_factor: 0.5
    ramp_up_threshold: 100

  aggressive:
    start_rps: 100.0
    min_rps: 1.0
    back_off_factor: 0.5

blockchain:
  chunk_size: 10000
  expected_block_time_seconds: 5
  block_timestamp_cache_size: 10000

retry:
  max_retries: 5
  initial_delay_ms: 100
  backoff_multiplier: 4.0
  extended_retry_wait_seconds: 300

