database:
  path: "postgresql://localhost/beeport4_testing"

rpc:
  endpoints:
    - url: "https://xdai.fairdatasociety.org"
      rate_limit: adaptive
      priority: 1
      weight: 1
    - url: "https://rpc.gnosischain.com"
      rate_limit: adaptive
      priority: 1
      weight: 1
    - url: "https://gnosis.drpc.org"
      rate_limit: adaptive
      priority: 1
      weight: 1
    - url: "https://1rpc.io/gnosis"
      rate_limit: adaptive
      priority: 1
      weight: 1

rate_limiting:
  max_concurrent_requests: 100
  adaptive:
    start_rps: 10.0
    max_rps: 500.0
    ramp_up_factor: 1.2
    back_off_factor: 0.5
    ramp_up_threshold: 100
