database:
  path: "postgresql://localhost/beeport3m"

rpc:
  endpoints:
    # Official Gnosis Chain RPC
    - url: "https://rpc.gnosischain.com"
      rate_limit: adaptive
      priority: 1
      weight: 1

    # # 1RPC - Privacy-focused
    # - url: "https://1rpc.io/gnosis"
    #   rate_limit: adaptive
    #   priority: 1
    #   weight: 1

    # PublicNode - Community infrastructure
    - url: "https://gnosis-rpc.publicnode.com"
      rate_limit: adaptive
      priority: 1
      weight: 1

    # Fairdatasociety
    - url: "https://xdai.fairdatasociety.org"
      rate_limit: adaptive
      priority: 2
      weight: 1

    # ssh
    - url: "http://localhost:8545"
      rate_limit: adaptive
      priority: 2
      weight: 1

    # # Gateway.fm - Public access
    # - url: "https://rpc.gnosis.gateway.fm"
    #   rate_limit: adaptive
    #   priority: 1
    #   weight: 1

    # # dRPC - AI-powered load balancer
    # - url: "https://gnosis.drpc.org"
    #   rate_limit: adaptive
    #   priority: 1
    #   weight: 1

rate_limiting:
  max_concurrent_requests: 10
  health_check_interval_seconds: 60
  stats_log_interval_seconds: 30

  adaptive:
    start_rps: 2.0
    max_rps: 50.0
    min_rps: 0.5          # Minimum rate floor (prevents deadlock)
    ramp_up_factor: 1.1
    back_off_factor: 0.5
    ramp_up_threshold: 50

  aggressive:
    start_rps: 10.0
    min_rps: 0.5
    back_off_factor: 0.3

  recovery:              # Automatic recovery after rate limits
    cool_down_period_secs: 60      # Wait 60s after last 429 before recovery
    min_healthy_rate: 5.0          # Reset to 5 req/s after cool-down
    gradual_recovery_factor: 1.05  # Increase by 5% every check
    recovery_check_interval_secs: 30  # Check every 30 seconds

blockchain:
  chunk_size: 500
  expected_block_time_seconds: 5
  block_timestamp_cache_size: 10000

retry:
  max_retries: 5
  initial_delay_ms: 100
  backoff_multiplier: 4.0
  extended_retry_wait_seconds: 300

